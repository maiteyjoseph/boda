<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nuestra Boda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    /* Make the page fill the screen and center content */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #faf7f2; /* soft background color */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      text-align: center;
      padding: 1.5rem;
    }

    .message-image {
      max-width: 90vw;
      max-height: 80vh;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .caption {
      margin-top: 1rem;
      font-size: 1rem;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Put your image file (e.g. message.jpg) in the same folder as index.html -->
    <img src="assets/Closed_save_date.jpeg" alt="Message from the bride and groom" class="message-image" />
    <!-- Optional text under the picture -->
    <p class="caption"></p>
  </div>
</body>
</html>
